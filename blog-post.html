        display: block;
      }

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

    <script>
      // MORE TO READ — related blog posts (same category first, falls back to most recent)
      (async function loadRelatedPosts(){
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const grid = document.getElementById('related-posts-grid');
        const section = document.getElementById('related-posts-section');
        if(!id || !grid){ if(section) section.style.display = 'none'; return; }

        function waitForClient(){
          return new Promise(resolve=>{
            if(window.supabaseClient) return resolve(window.supabaseClient);
            const check = setInterval(()=>{
              if(window.supabaseClient){ clearInterval(check); resolve(window.supabaseClient); }
            }, 100);
            setTimeout(()=>{ clearInterval(check); resolve(window.supabaseClient || null); }, 8000);
          });
        }

        try{
          const client = await waitForClient();
          if(!client){ section.style.display = 'none'; return; }

          const { data: current } = await client
            .from('blog_posts')
            .select('category')
            .eq('id', id)
            .single();
          const category = current ? current.category : null;

          let related = [];
          if(category){
            const { data } = await client
              .from('blog_posts')
              .select('id,title,short_description,cover_url,category')
              .eq('status','published')
              .eq('category', category)
              .neq('id', id)
              .order('created_at', { ascending:false })
              .limit(3);
            related = data || [];
          }

          if(related.length < 3){
            const { data: fallback } = await client
              .from('blog_posts')
              .select('id,title,short_description,cover_url,category')
              .eq('status','published')
              .neq('id', id)
              .order('created_at', { ascending:false })
              .limit(6);
            const existingIds = new Set(related.map(p => p.id));
            const extra = (fallback || []).filter(p => !existingIds.has(p.id));
            related = [...related, ...extra].slice(0, 3);
          }

          if(!related.length){ section.style.display = 'none'; return; }

          grid.innerHTML = related.map(post => `
            <article class="blog-card">
              <img src="${post.cover_url || ''}" alt="${post.title}" onerror="this.outerHTML='<div class=&quot;image-placeholder&quot;>Image coming soon</div>';" />
              <h3>${post.title}</h3>
              <p>${post.short_description || ''}</p>
              <div class="card-actions">
                <a class="btn btn-read" href="blog-post.html?id=${post.id}">Read More</a>
              </div>
            </article>
          `).join('');
        }catch(e){
          console.error('Failed to load related posts', e);
          if(section) section.style.display = 'none';
        }
      })();
    </script>
