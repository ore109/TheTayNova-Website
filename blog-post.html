    <style>
      .gallery-block {
        margin: 1.5rem 0;
        border-radius: 16px;
        overflow: hidden;
        border: 1px dashed rgba(201,162,39,0.3);
        background: rgba(245,239,230,0.06);
        padding: 0.75rem;
      }
      .gallery-grid { display: grid; gap: 0.5rem; }
      .gallery-grid.count-1 { grid-template-columns: 1fr; }
      .gallery-grid.count-2 { grid-template-columns: 1fr 1fr; }
      .gallery-grid.count-3 { grid-template-columns: 1fr 1fr 1fr; }
      .gallery-cell {
        position: relative;
        aspect-ratio: 16/9;
        border-radius: 12px;
        overflow: hidden;
        background: rgba(255,255,255,0.06);
      }
      .gallery-cell img,
      .gallery-cell video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .gallery-cell-remove,
      .gallery-add-btn { display: none; }
      .gallery-caption {
        width: 100%;
        margin-top: 0.5rem;
        background: transparent;
        border: none;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        color: rgba(255,255,255,0.5);
        font-size: 0.82rem;
        padding: 0.35rem 0;
        outline: none;
        font-style: italic;
      }
      .blog-detail-content .gallery-block,
      .post-content .gallery-block {
        border-color: rgba(201,162,39,0.2);
        background: rgba(245,239,230,0.4);
      }
      .blog-detail-content .gallery-caption,
      .post-content .gallery-caption {
        color: rgba(0,0,0,0.45);
        border-bottom-color: rgba(0,0,0,0.1);
        pointer-events: none;
      }
      @media (max-width: 700px) {
        .gallery-grid.count-2,
        .gallery-grid.count-3 { grid-template-columns: 1fr; }
      }
    </style>
  </head>
